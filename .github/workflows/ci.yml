name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: for f in $(find scripts tools -name '*.mjs'); do node --check "$f"; done

      - name: Lint
        run: npm run lint

      - name: Validate module.json
        run: node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')) && 'module.json OK'"

      - name: Validate lang/en.json
        run: node -p "JSON.parse(require('fs').readFileSync('lang/en.json','utf8')) && 'lang/en.json OK'"

      # A missing localisation key does not throw. Foundry renders the key itself, so nothing above
      # can catch one.
      - name: Check localisation keys
        run: npm run check-lang

      # Every file the release zip lists has to exist, or the zip step fails only at tag time, which
      # is the worst moment to find out.
      - name: Check the release zip contents exist
        run: |
          for p in module.json scripts lang styles LICENSE README.md CHANGELOG.md; do
            test -e "$p" || { echo "missing from the release zip: $p"; exit 1; }
          done
          echo "every release path exists"
